<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Research Radar</title>
  <style>
    :root{--bg:#f8fafd;--surface:#fff;--text:#202124;--muted:#5f6368;--line:#dfe6f3;--blue:#1a73e8;--blue-soft:#e8f0fe;--green:#188038;--green-soft:#e6f4ea;--yellow:#f9ab00;--yellow-soft:#fef7e0;--red:#d93025;--red-soft:#fce8e6;--purple-soft:#f3e8fd;--shadow:0 18px 55px rgba(60,64,67,.10);--shadow-soft:0 8px 28px rgba(60,64,67,.08)}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;color:var(--text);background:radial-gradient(circle at top left,rgba(66,133,244,.14),transparent 32rem),radial-gradient(circle at 88% 8%,rgba(52,168,83,.12),transparent 26rem),linear-gradient(180deg,#fff 0%,var(--bg) 34rem);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Google Sans","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.72} a{color:var(--blue);text-decoration:none;font-weight:650} a:hover{text-decoration:underline}
    .app-shell{width:min(1440px,calc(100vw - 32px));margin:0 auto;padding:22px 0 56px}.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 16px;margin-bottom:20px;background:rgba(255,255,255,.78);border:1px solid rgba(223,230,243,.8);border-radius:999px;backdrop-filter:blur(18px);box-shadow:0 8px 24px rgba(60,64,67,.08)}.brand{display:flex;align-items:center;gap:12px;min-width:230px}.brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;color:white;font-weight:900;background:conic-gradient(from 140deg,#4285f4,#34a853,#fbbc04,#ea4335,#4285f4);box-shadow:0 8px 20px rgba(26,115,232,.28)}.brand-title{font-size:15px;font-weight:800;letter-spacing:-.01em}.brand-subtitle{margin-top:-2px;color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:10px;flex:1;justify-content:flex-end}.search-box{position:relative;flex:1;max-width:460px}.search-box input{width:100%;border:1px solid var(--line);border-radius:999px;padding:12px 44px;background:#f8fafd;color:var(--text);outline:none;font-size:14px}.search-box input:focus{border-color:rgba(26,115,232,.55);background:white;box-shadow:0 0 0 4px rgba(26,115,232,.12)}.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}.pill-link{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:white;color:var(--text);border-radius:999px;padding:10px 14px;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 2px 10px rgba(60,64,67,.05)}
    .hero{overflow:hidden;position:relative;border:1px solid rgba(223,230,243,.9);border-radius:30px;background:linear-gradient(135deg,rgba(232,240,254,.92),rgba(255,255,255,.96) 46%,rgba(230,244,234,.8)),white;box-shadow:var(--shadow);padding:clamp(24px,4vw,46px);margin-bottom:22px}.hero:after{content:"";position:absolute;right:-120px;top:-120px;width:320px;height:320px;border-radius:999px;background:radial-gradient(circle,rgba(251,188,4,.30),rgba(251,188,4,0) 66%)}.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.76);border:1px solid rgba(223,230,243,.9);color:var(--blue);font-size:13px;font-weight:800;margin-bottom:18px}h1{margin:0 0 12px;font-size:clamp(34px,6vw,68px);line-height:1.02;letter-spacing:-.055em;max-width:930px}.hero-copy{margin:0;max-width:840px;color:var(--muted);font-size:clamp(16px,2vw,20px)}.status-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:24px}.metric-card{min-height:98px;padding:16px;border-radius:22px;background:rgba(255,255,255,.80);border:1px solid rgba(223,230,243,.92);box-shadow:0 10px 24px rgba(60,64,67,.06)}.metric-label{display:block;color:var(--muted);font-size:12px;font-weight:760;text-transform:uppercase;letter-spacing:.04em}.metric-value{display:block;margin-top:7px;color:var(--text);font-size:18px;font-weight:850;line-height:1.25;word-break:break-word}
    .layout{display:grid;grid-template-columns:286px minmax(0,1fr);gap:22px;align-items:start}.side-panel{position:sticky;top:92px;max-height:calc(100vh - 112px);overflow:auto;padding:18px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);box-shadow:var(--shadow-soft)}.side-panel h2{margin:0 0 12px;font-size:14px;letter-spacing:.02em;color:var(--muted);text-transform:uppercase}.filter-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.filter-chip{border:1px solid var(--line);border-radius:999px;padding:8px 11px;background:#fff;color:var(--muted);cursor:pointer;font-size:12px;font-weight:800}.filter-chip.active{color:var(--blue);background:var(--blue-soft);border-color:rgba(26,115,232,.26)}.toc{display:grid;gap:7px}.toc a{display:block;color:#3c4043;border-radius:12px;padding:8px 10px;font-size:13px;font-weight:650}.toc a:hover{background:#f1f5ff;text-decoration:none}.content-panel,.report-content{display:grid;gap:18px}.section-block,.overview-card{padding:clamp(18px,3vw,28px);border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.86);box-shadow:var(--shadow-soft)}h2,h3,h4{scroll-margin-top:110px}h2{margin:16px 0 12px;font-size:clamp(24px,3vw,34px);line-height:1.15;letter-spacing:-.035em}h3{margin:20px 0 12px;color:#174ea6;font-size:21px;letter-spacing:-.02em}h4{display:inline-flex;align-items:center;gap:8px;margin:14px 0 10px;padding:7px 11px;border-radius:999px;color:var(--muted);background:#f1f5ff;font-size:13px;font-weight:850;text-transform:uppercase;letter-spacing:.035em}h5{margin:0;font-size:19px;line-height:1.35;letter-spacing:-.02em}ul{margin:10px 0;padding-left:20px}li{margin:6px 0}.overview-card ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0;margin:16px 0 0;list-style:none}.overview-card li{padding:14px 15px;background:white;border:1px solid var(--line);border-radius:18px;color:#3c4043}
    .radar-card{position:relative;padding:20px;margin:14px 0 18px;border:1px solid var(--line);border-radius:26px;background:white;box-shadow:var(--shadow-soft);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.radar-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:rgba(26,115,232,.28)}.card-head{display:flex;align-items:start;justify-content:space-between;gap:16px;margin-bottom:12px}.tier-badge{flex:none;display:inline-flex;align-items:center;border-radius:999px;padding:7px 10px;font-size:11px;letter-spacing:.04em;font-weight:900;text-transform:uppercase}.tier-must-read .tier-badge{background:var(--red-soft);color:var(--red)}.tier-skim .tier-badge{background:var(--yellow-soft);color:#8a5b00}.tier-watch .tier-badge{background:var(--blue-soft);color:var(--blue)}.tier-archive .tier-badge{background:#f1f3f4;color:var(--muted)}.tier-other .tier-badge{background:var(--green-soft);color:var(--green)}.radar-card ul{padding-left:0;margin:0;list-style:none}.radar-card li{padding:10px 0;margin:0;border-top:1px solid #eef2f8;color:#3c4043}.radar-card li:nth-child(n+8){display:none}.radar-card.expanded li{display:block}.toggle-details{margin-top:14px;border:0;border-radius:999px;padding:9px 13px;background:var(--blue-soft);color:var(--blue);font-weight:850;cursor:pointer}.summary-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:0;list-style:none}.summary-list li{margin:0;padding:13px;border:1px solid var(--line);border-radius:18px;background:#fff;min-height:86px}.summary-list li.hidden,.radar-card.hidden{display:none!important}.score-section,.tag-section,.keyword-section{border-radius:14px;padding:10px 12px!important;border-top:0!important}.score-section{background:var(--blue-soft)}.tag-section{background:var(--green-soft)}.keyword-section{background:var(--purple-soft)}code{padding:2px 6px;border-radius:8px;background:#f1f3f4;font-size:.92em}.loading-card,.empty-state{padding:24px;border-radius:24px;border:1px dashed #cbd5e1;background:rgba(255,255,255,.8);color:var(--muted)}.footer-note{color:var(--muted);font-size:13px;text-align:center;margin:28px 0 0}
    @media(max-width:1080px){.layout{grid-template-columns:1fr}.side-panel{position:relative;top:0;max-height:none}.status-grid,.overview-card ul,.summary-list{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:720px){.app-shell{width:min(100% - 20px,1440px);padding-top:10px}.topbar{align-items:stretch;border-radius:24px;flex-direction:column}.top-actions{width:100%;flex-direction:column}.search-box,.pill-link{width:100%;max-width:none}.status-grid,.overview-card ul,.summary-list{grid-template-columns:1fr}.hero{padding:24px 18px}.card-head{flex-direction:column-reverse}}
  </style>
</head>
<body>
  <div class="app-shell">
    <nav class="topbar"><div class="brand"><div class="brand-mark">R</div><div><div class="brand-title">AI Research Radar</div><div class="brand-subtitle">Readable daily frontier signals</div></div></div><div class="top-actions"><label class="search-box"><span class="search-icon">⌕</span><input id="radar-search" type="search" placeholder="搜索论文、方向、机构或关键词"></label><a class="pill-link" href="report.md">Markdown</a><a class="pill-link" href="https://github.com/georgeorange-crypto/ai-research-radar">GitHub</a></div></nav>
    <header class="hero"><div class="eyebrow">✨ Research intelligence dashboard</div><div id="hero-title"><h1>AI Research Radar</h1></div><p class="hero-copy">把密集日报转成适合人类阅读的研究雷达：先看主线，再看 Must Read，最后按方向筛选。</p><div class="status-grid" id="status-grid"></div></header>
    <div class="layout"><aside class="side-panel"><h2>Reading filters</h2><div class="filter-chips" id="filter-chips"><button class="filter-chip active" data-filter="all">All</button><button class="filter-chip" data-filter="must_read">Must Read</button><button class="filter-chip" data-filter="skim">Skim</button><button class="filter-chip" data-filter="watch">Watch</button><button class="filter-chip" data-filter="archive">Archive</button></div><h2>Sections</h2><div class="toc" id="toc"></div></aside><main class="content-panel"><article class="report-content" id="report-content"><div class="loading-card">正在加载最新 report.md...</div></article><p class="footer-note">Generated by AI Research Radar. Designed for fast triage, not blind hype following.</p></main></div>
  </div>
  <script>
    const root=document.getElementById('report-content');const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
    function inline(t){let x=esc(t);x=x.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,a,b)=>`<a href="${String(b).replace(/"/g,'&quot;')}">${a}</a>`);x=x.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');return x}
    function cls(t){return /评分：|global_score|personal_score/.test(t)?'score-section':/相关标签：/.test(t)?'tag-section':/命中关键词：/.test(t)?'keyword-section':''}
    function md2html(md){let p=[],list=false,code=false,buf=[];const close=()=>{if(list){p.push('</ul>');list=false}};for(const line of String(md||'').split(/\r?\n/)){const s=line.trim();if(s.startsWith('```')){if(code){p.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');buf=[];code=false}else{close();code=true}continue}if(code){buf.push(line);continue}if(!s){close();continue}let h=s.match(/^(#{1,6})\s+(.+)$/);if(h){close();p.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);continue}if(/^[-*+]\s+/.test(s)){if(!list){p.push('<ul>');list=true}const c=s.slice(2);p.push(`<li class="${cls(c)}">${inline(c)}</li>`);continue}close();p.push('<p>'+inline(s)+'</p>')}close();return p.join('\n')}
    function tier(t){t=String(t||'').toUpperCase();if(t.includes('MUST_READ')||t.includes('MUST READ'))return'must_read';if(t.includes('SKIM'))return'skim';if(t.includes('WATCH'))return'watch';if(t.includes('ARCHIVE'))return'archive';return'other'}function label(t){return{must_read:'Must Read',skim:'Skim',watch:'Watch',archive:'Archive',other:'Signal'}[t]}
    async function load(){try{const r=await fetch('report.md?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);root.innerHTML=md2html(await r.text())}catch(e){root.innerHTML='<div class="empty-state">无法加载 report.md。请检查 GitHub Pages 是否已部署最新文件。</div>'}}
    function enhance(){let h1=root.querySelector('h1');if(h1){document.getElementById('hero-title').innerHTML='';document.getElementById('hero-title').appendChild(h1)}let first=root.querySelector('ul'),grid=document.getElementById('status-grid');if(first&&grid){let items=[...first.querySelectorAll(':scope>li')].map(li=>li.textContent),keys=['Summary mode','Provider','Model','LLM summary calls','Estimated cost','Cost guard','api_requests_total','cache_hits'];grid.innerHTML=keys.map(k=>items.find(x=>norm(x).startsWith(norm(k)))).filter(Boolean).slice(0,8).map(x=>{let a=x.split(':'),k=a.shift(),v=a.join(':').trim()||x;return `<div class="metric-card"><span class="metric-label">${esc(k)}</span><span class="metric-value">${esc(v)}</span></div>`}).join('');first.remove()}let ov=[...root.querySelectorAll('h2')].find(h=>h.textContent.includes('Daily Overview'));if(ov&&ov.nextElementSibling?.tagName==='UL'){let c=document.createElement('section');c.className='overview-card';ov.parentNode.insertBefore(c,ov);c.append(ov,ov.nextElementSibling)}[...root.querySelectorAll('h2')].filter(h=>!h.closest('.overview-card')).forEach(h=>{let w=document.createElement('section');w.className='section-block';h.parentNode.insertBefore(w,h);w.appendChild(h);let n=w.nextSibling;while(n&&!(n.nodeType===1&&n.tagName==='H2')){let nx=n.nextSibling;w.appendChild(n);n=nx}});[...root.querySelectorAll('h5')].forEach(h=>{let ul=h.nextElementSibling;if(!ul||ul.tagName!=='UL')return;let t=tier(h.textContent+' '+ul.textContent),card=document.createElement('article');card.className='radar-card tier-'+t.replace('_','-');card.dataset.tier=t;card.dataset.search=norm(h.textContent+' '+ul.textContent);card.innerHTML=`<div class="card-head"><div>${h.outerHTML}</div><span class="tier-badge">${label(t)}</span></div>`;card.appendChild(ul);if(ul.querySelectorAll('li').length>7){let b=document.createElement('button');b.className='toggle-details';b.textContent='展开详情';b.onclick=()=>{card.classList.toggle('expanded');b.textContent=card.classList.contains('expanded')?'收起详情':'展开详情'};card.appendChild(b)}h.replaceWith(card)});[...root.querySelectorAll('h4+ul')].forEach(ul=>{if(ul.closest('.radar-card'))return;ul.classList.add('summary-list');[...ul.children].forEach(li=>{li.dataset.tier=tier(li.textContent);li.dataset.search=norm(li.textContent)})});let toc=document.getElementById('toc');toc.innerHTML=[...root.querySelectorAll('h2,h3')].slice(0,18).map((h,i)=>{h.id=h.id||('sec-'+i);return `<a href="#${h.id}">${esc(h.textContent)}</a>`}).join('');bind()}
    function bind(){let input=document.getElementById('radar-search'),chips=[...document.querySelectorAll('.filter-chip')],active='all';function apply(){let q=norm(input.value),nodes=[...root.querySelectorAll('.radar-card,.summary-list li')],v=0;nodes.forEach(n=>{let ok=(active==='all'||n.dataset.tier===active)&&(!q||(n.dataset.search||norm(n.textContent)).includes(q));n.classList.toggle('hidden',!ok);if(ok)v++})}chips.forEach(c=>c.onclick=()=>{chips.forEach(x=>x.classList.remove('active'));c.classList.add('active');active=c.dataset.filter;apply()});input.oninput=apply;apply()}
    load().then(enhance);
  </script>
</body>
</html>
