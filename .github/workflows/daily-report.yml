name: Daily AI Research Radar

on:
  push:
    branches:
      - main
    paths-ignore:
      - "report.md"
      - "index.html"
      - "reports/**"
      - "data/raw/**"
      - "data/processed/**"
      - "data/llm_cache/**"
  schedule:
    # 06:30 Asia/Shanghai.
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ai-research-radar
  cancel-in-progress: true

jobs:
  build-report:
    runs-on: ubuntu-latest
    env:
      RADAR_TIMEZONE: Asia/Shanghai
      RADAR_RANK_LIMIT: "0"
      MODEL_MODE: single
      OPENAI_SUMMARY_BUDGET: "3"
      MAX_LLM_ITEMS: "5"
      MAX_EVIDENCE_CHARS: "1600"
      MAX_OUTPUT_TOKENS: "250"
      ROLE_PIPELINE_BUDGET: "3"
      SINGLE_LLM_BUDGET: "3"
      RULE_BASED_CRITIC: "true"
      CRITIC_LLM_ENABLED: "false"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      KIMI_BASE_URL: ${{ vars.KIMI_BASE_URL }}
      KIMI_MODEL: ${{ vars.KIMI_MODEL }}
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      GLM_BASE_URL: ${{ vars.GLM_BASE_URL }}
      GLM_MODEL: ${{ vars.GLM_MODEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Secret safety check
        shell: python
        run: |
          import pathlib
          import re
          import subprocess
          import sys

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          if ".env" in tracked:
              print("::error::.env must not be tracked")
              sys.exit(1)

          assignment_pattern = re.compile(
              r"\b(OPENAI_API_KEY|DEEPSEEK_API_KEY|KIMI_API_KEY|GLM_API_KEY)="
              r"([^\s'\"`]+)"
          )
          token_patterns = [
              re.compile(r"\bsk-(?:proj-|svcacct-)?[A-Za-z0-9_-]{20,}\b"),
              re.compile(r"\bBearer\s+([A-Za-z0-9._-]{20,})"),
          ]
          skipped_prefixes = (
              "data/raw/",
              "data/processed/",
              "data/llm_cache/",
              "reports/history/",
          )
          skipped_suffixes = (
              ".docx",
              ".pdf",
              ".png",
              ".jpg",
              ".jpeg",
              ".gif",
              ".zip",
          )

          def looks_like_placeholder(value):
              lower = value.strip().strip('"\'').lower()
              placeholders = {
                  "",
                  "xxx",
                  "xxxxx",
                  "sk-xxx",
                  "example",
                  "placeholder",
                  "changeme",
                  "dummy",
                  "token",
                  "your_api_key",
                  "your_key_here",
              }
              return (
                  lower in placeholders
                  or lower.startswith("<")
                  or "example" in lower
                  or "placeholder" in lower
                  or "your_" in lower
              )

          def looks_like_secret(value):
              value = value.strip().strip('"\'')
              if looks_like_placeholder(value):
                  return False
              if value.startswith("sk-") and not re.search(r"\d", value):
                  return False
              return len(value) >= 20 and len(set(value)) >= 10

          hits = []
          for name in tracked:
              normalized_name = name.replace("\\", "/")
              if normalized_name.startswith(skipped_prefixes) or normalized_name.lower().endswith(skipped_suffixes):
                  continue
              path = pathlib.Path(name)
              if not path.is_file():
                  continue
              with path.open(encoding="utf-8", errors="ignore") as handle:
                  for line_number, line in enumerate(handle, start=1):
                      for match in assignment_pattern.finditer(line):
                          if not looks_like_secret(match.group(2)):
                              continue
                          hits.append(f"{name}:{line_number}")
                      for pattern in token_patterns:
                          for match in pattern.finditer(line):
                              value = match.group(1) if match.lastindex else match.group(0)
                              if not looks_like_secret(value):
                                  continue
                              hits.append(f"{name}:{line_number}")
                              break
                          else:
                              continue
                          break
          if hits:
              print("::error::Potential secret material found in tracked files")
              print("\n".join(hits))
              sys.exit(1)

      - name: Run tests
        run: python -m pytest

      - name: Generate report
        run: python run.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.md index.html reports
          git add -f data/raw data/processed
          if [ -d data/llm_cache ]; then
            git add -f data/llm_cache
          fi
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: update daily AI research radar"
            git push
          fi
