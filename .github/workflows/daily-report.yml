name: Daily AI Research Radar

on:
  push:
    branches:
      - main
    paths-ignore:
      - "report.md"
      - "index.html"
      - "reports/**"
      - "data/raw/**"
      - "data/processed/**"
      - "data/llm_cache/**"
  schedule:
    # 06:30 Asia/Shanghai.
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ai-research-radar
  cancel-in-progress: true

jobs:
  build-report:
    runs-on: ubuntu-latest
    env:
      RADAR_TIMEZONE: Asia/Shanghai
      RADAR_RANK_LIMIT: "0"
      MODEL_MODE: single
      OPENAI_SUMMARY_BUDGET: "3"
      MAX_LLM_ITEMS: "5"
      MAX_EVIDENCE_CHARS: "1600"
      MAX_OUTPUT_TOKENS: "250"
      ROLE_PIPELINE_BUDGET: "3"
      SINGLE_LLM_BUDGET: "3"
      RULE_BASED_CRITIC: "true"
      CRITIC_LLM_ENABLED: "false"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      KIMI_BASE_URL: ${{ vars.KIMI_BASE_URL }}
      KIMI_MODEL: ${{ vars.KIMI_MODEL }}
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      GLM_BASE_URL: ${{ vars.GLM_BASE_URL }}
      GLM_MODEL: ${{ vars.GLM_MODEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Secret safety check
        shell: python
        run: |
          import pathlib
          import re
          import subprocess
          import sys

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          if ".env" in tracked:
              print("::error::.env must not be tracked")
              sys.exit(1)

          pattern = re.compile(
              r"sk-[A-Za-z0-9_-]{20,}|"
              r"OPENAI_API_KEY=.+|DEEPSEEK_API_KEY=.+|"
              r"KIMI_API_KEY=.+|GLM_API_KEY=.+|"
              r"Bearer [A-Za-z0-9._-]{20,}"
          )
          hits = []
          for name in tracked:
              path = pathlib.Path(name)
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              for match in pattern.finditer(text):
                  line = text.count("\n", 0, match.start()) + 1
                  hits.append(f"{name}:{line}")
          if hits:
              print("::error::Potential secret material found in tracked files")
              print("\n".join(hits))
              sys.exit(1)

      - name: Run tests
        run: python -m pytest

      - name: Generate report
        run: python run.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.md index.html reports
          git add -f data/raw data/processed
          if [ -d data/llm_cache ]; then
            git add -f data/llm_cache
          fi
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: update daily AI research radar"
            git push
          fi
